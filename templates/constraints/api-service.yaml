# BMAD-EVO Constraint Template: API Service
# 适用于：REST API、微服务、后端服务

constraints:
  boundary_check:
    - check_null: true
    - check_empty: true
    - validate_inputs: true
  
  exception_handling:
    - check_io: true
    - check_network: true
    - no_bare_except: true
  
  code_structure:
    - max_function_lines: 50
    - max_file_lines: 500
  
  readability:
    - require_docstrings: true
    - min_variable_length: 3
  
  security:
    - check_secrets: true
    - check_injection: true
    - require_auth: true
  
  api_specific:
    - validate_request: true
      description: "所有请求参数必须验证"
    - standard_response: true
      description: "响应格式必须统一"
    - error_handling: true
      description: "错误必须有统一处理，返回标准错误码"
